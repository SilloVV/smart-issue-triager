[project]
name = "smart-issue-triager"
version = "0.1.0"
description = "Tickets sorter"
readme = "README.md"
authors = [
    { name = "SilloVV", email = "wnakib21@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.30",
    "datasets>=4.5.0",
    "huggingface-hub>=1.3.2",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]
