[project]
name = "smart-issue-triager"
version = "0.1.0"
description = "Tickets sorter"
readme = "README.md"
authors = [
    { name = "SilloVV", email = "wnakib21@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.30",
    "datasets>=4.5.0",
    "google-api-python-client>=2.188.0",
    "huggingface-hub>=1.3.2",
    "mlflow>=1.27.0",
    "pandas>=2.3.3",
    "peft>=0.18.1",
    "protobuf<5.0.0",
    "pyarrow>=23.0.0",
    "scikit-learn>=1.8.0",
    "setuptools>=80.9.0",
    "torch>=2.9.1",
    "transformers>=5.0.0rc3",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto>=5.1.20",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]
