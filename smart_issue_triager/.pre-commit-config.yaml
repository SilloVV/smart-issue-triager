repos:
  # 1. RUFF (Linter + Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 2. YAMLLINT
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-d, relaxed]

  # 3. PROTECTION (Empêche de commit sur main/trunk directement)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'trunk']
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # 4. TERRAFORM & TESTS (Hooks Locaux pour Windows)
  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform fmt
        entry: terraform fmt
        language: system
        files: \.tf$

      - id: terraform-validate
        name: Terraform validate
        entry: terraform validate
        language: system
        files: \.tf$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: smart_issue_triager\\.venv\\Scripts\\python.exe -m pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
